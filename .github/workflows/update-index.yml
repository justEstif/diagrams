name: Update index

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  rebuild-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate index.html
        run: |
          python3 - <<'EOF'
          import os, re, html, datetime

          pages = []
          for f in sorted(os.listdir(".")):
              if not f.endswith(".html") or f in ("index.html", "404.html"):
                  continue
              content = open(f, encoding="utf-8").read()
              def grab(pattern, default):
                  m = re.search(pattern, content, re.IGNORECASE | re.DOTALL)
                  return html.escape(m.group(1).strip()) if m else default
              # eyebrow / subtitle give each diagram its meta line
              title = grab(r'<h1[^>]*>(.*?)</h1>', f)
              meta = grab(r'class="eyebrow"[^>]*>(.*?)</p>', "")
              date = datetime.date.fromtimestamp(os.path.getmtime(f)).isoformat()
              pages.append((f, title, meta, date))

          items = "\n".join(
              f'<li><a href="{f}"><span class="name">{t}</span>'
              f'<span class="meta">{m} · {d}</span></a></li>'
              for f, t, m, d in pages
          )

          page = f"""<!DOCTYPE html>
          <html lang="en">
          <head>
          <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
          <title>Diagrams</title>
          <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Geist:wght@400;500;600&family=Geist+Mono&display=swap" rel="stylesheet">
          <style>
          *{{box-sizing:border-box;margin:0;padding:0}}
          body{{font-family:'Geist',system-ui,sans-serif;background:#f3f2f0;color:#252f3d;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:3rem 2rem}}
          .frame{{max-width:640px;width:100%}}
          .eyebrow{{font-family:'Geist Mono',monospace;font-size:.66rem;letter-spacing:.18em;text-transform:uppercase;color:#5c5752;margin-bottom:.5rem}}
          h1{{font-family:'Instrument Serif',serif;font-weight:400;font-size:1.75rem;margin-bottom:1.5rem}}
          ul{{list-style:none}}
          li{{border-top:1px solid rgba(37,47,61,.12)}}
          li:last-child{{border-bottom:1px solid rgba(37,47,61,.12)}}
          a{{display:flex;justify-content:space-between;align-items:baseline;padding:1rem .25rem;text-decoration:none;color:#252f3d}}
          a:hover .name{{color:#b86b52}}
          .name{{font-weight:600}}
          .meta{{font-family:'Geist Mono',monospace;font-size:.66rem;color:#7d7a76}}
          .colophon{{margin-top:2rem;font-family:'Geist Mono',monospace;font-size:.62rem;letter-spacing:.1em;color:#7d7a76}}
          </style>
          </head>
          <body>
          <div class="frame">
          <p class="eyebrow">DIAGRAMS</p>
          <h1>Architecture sketches</h1>
          <ul>
          {items}
          </ul>
          <p class="colophon">JUSTESTIF / DIAGRAMS · AUTO-INDEXED</p>
          </div>
          </body>
          </html>"""

          open("index.html", "w", encoding="utf-8").write(page)
          print(f"indexed {len(pages)} diagram(s)")
          EOF

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || (git commit -m "Auto-update index [skip ci]" && git push)
